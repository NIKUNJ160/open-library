version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: universal_search_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./.env:/app/.env:ro
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: universal_search_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  frontend:
    image: nginx:alpine
    container_name: universal_search_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - app-network

volumes:
  redis_data:

networks:
  app-network:
    driver: bridge
